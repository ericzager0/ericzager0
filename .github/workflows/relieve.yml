name: Relieve de actividad

on:
  schedule:
    - cron: "17 9 * * *"   # todos los días, 6:17 en Buenos Aires
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  relieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install numpy==2.1.3

      - name: Dibujar el perfil de montaña
        run: python scripts/relieve.py
        env:
          GH_USER: ${{ github.repository_owner }}
          # Usa tu token personal si lo cargaste como secreto GH_PAT; si no, el automático de GitHub
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/relieve-light.svg assets/relieve-dark.svg
          git diff --staged --quiet || git commit -m "Actualiza relieve de actividad"
          git push
